name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Regenerate against a newer Terraform provider: bumps the module, then tfgen
  # + every SDK, and uploads the tree to commit where this repo is mirrored from.
  workflow_dispatch:
    inputs:
      terraform_version:
        description: Terraform provider tag to bridge (e.g. v0.2.1)
        required: true

jobs:
  provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: provider/go.sum
      - run: make test

  # The committed schema and SDKs must be what the Terraform provider produces
  # today; a stale tree means someone forgot `make tfgen build_sdks`.
  generated-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: provider/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: pulumi/actions@v6
      - if: github.event_name == 'workflow_dispatch'
        working-directory: provider
        env:
          GOFLAGS: -mod=mod
        run: |
          go get github.com/forumulate/terraform-provider-forumulate@${{ inputs.terraform_version }}
          go mod tidy
      - run: make tfgen build_sdks
      - if: github.event_name != 'workflow_dispatch'
        run: git diff --exit-code -- schema.json sdk/go provider/cmd
      # The regenerated tree, so a maintainer can commit it where this repo is mirrored from.
      - if: failure() || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: generated
          path: |
            schema.json
            sdk/
            provider/cmd/
            provider/go.mod
            provider/go.sum
