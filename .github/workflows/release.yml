name: release

# Push a vX.Y.Z tag. The plugin binaries always publish (GitHub release assets
# are what `pulumi plugin install ... --server github://api.github.com/forumulate`
# reads). Each package registry publishes only when its repository secret is
# set: NPM_TOKEN, PYPI_API_TOKEN, NUGET_PUBLISH_KEY. Without a secret that job's
# publish step is skipped and the run stays green, so it can be re-run after
# the secret is added (Actions > release > Re-run all jobs).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

env:
  GO_VERSION: "1.26"

jobs:
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: provider/go.sum
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # One job regenerates the SDKs from the tagged source and publishes them, so
  # what ships always matches the tag. Generation needs every toolchain.
  sdks:
    runs-on: ubuntu-latest
    needs: plugins
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      NUGET_PUBLISH_KEY: ${{ secrets.NUGET_PUBLISH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: provider/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: pulumi/actions@v6
      - name: Generate schema and SDKs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make tfgen build_sdks
      - name: Publish to npm
        id: npm_gate
        run: echo "has=$([ -n "$NPM_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.npm_gate.outputs.has == 'true'
        working-directory: sdk/nodejs/bin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Publish to PyPI
        id: pypi_gate
        run: echo "has=$([ -n "$PYPI_API_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.pypi_gate.outputs.has == 'true'
        working-directory: sdk/python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install build twine
          python -m build
          python -m twine upload dist/*

      - name: Publish to NuGet
        id: nuget_gate
        run: echo "has=$([ -n "$NUGET_PUBLISH_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.nuget_gate.outputs.has == 'true'
        working-directory: sdk/dotnet
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          dotnet build -c Release -p:Version="$V"
          dotnet nuget push "bin/Release/*.nupkg" --api-key "$NUGET_PUBLISH_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      # The Go SDK is a module in a subdirectory: Go resolves it from a
      # sdk/vX.Y.Z tag on this repo, no registry and no secret.
      - name: Tag the Go SDK
        run: |
          git tag "sdk/${GITHUB_REF_NAME}"
          git push origin "sdk/${GITHUB_REF_NAME}"
